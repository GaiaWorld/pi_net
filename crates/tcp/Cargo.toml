[package]
name = "pi_tcp"
version = "0.8.0"
edition = "2021"
description = "pi_tcp"
repository = "https://github.com/GaiaWorld/pi_net/tree/crateio"
license = "MIT OR Apache-2.0"
keywords = ["pi",  "tcp"]

[dependencies]
futures = "0.3"
mio = { version = "0.8", features = ["net", "os-poll"] }
dashmap = "6.1"
lazy_static = "1.5"
bytes = "~1.11"
parking_lot = "0.12"
crossbeam-channel = "0.5"
fnv = "1.0"
num_cpus = "1.16"
rustls = "0.20"
rustls-pemfile = "1.0"
spin_sleep_util = "~0.1"
log = "0.4"
pi-async-rt = "0.5"
pi_async_buffer = "0.11"
pi_hash = { version = "0.1", features = ["xxhash"] }
pi_cancel_timer = "0.4"
slotmap = { version = "0.3", package = "pi_slotmap" }

[dev-dependencies]
env_logger = "0.11"
