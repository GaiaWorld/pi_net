[package]
name = "pi_dns_resolver"
version = "0.6.2"

edition = "2021"
description = "Provides related functions for asynchronous domain name resolution"
repository = "https://github.com/GaiaWorld/pi_net/tree/master/dns_resolver"
license = "MIT OR Apache-2.0"
keywords = ["pi",  "dns", "resolver"]

[features]
default = ["runtime_metrics"]
# 仅控制本库冷初始化登记，不启用采集或上报。
runtime_metrics = []

[dependencies]
dashmap = "6.2"
pi-async-rt = "0.5.17"
log = "0.4"

hickory-proto = "0.24"
hickory-resolver = "0.24"

[dev-dependencies]
crossbeam-channel = "0.5"
