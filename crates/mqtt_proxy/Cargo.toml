[package]
name = "pi_mqtt_proxy"
version = "0.8.0"
authors = ["vmos <vmos@fairblock.io>"]
edition = "2021"
description = "pi_mqtt_proxy"
repository = "https://github.com/GaiaWorld/pi_net/tree/crateio"
license = "MIT OR Apache-2.0"
keywords = ["pi", "mqtt_proxy"]

[dependencies]
futures = "0.3"
tcp = { version = "0.8", path = "../tcp", package = "pi_tcp" }
quic = { version = "0.10", path = "../quic", package = "pi_quic" }
mqtt = { version = "0.8", path = "../mqtt", package = "pi_mqtt" }
pi-async-rt = "0.5"
pi_handler = "0.3"
pi_gray = "0.1"
pi_atom = "0.7"
log = "0.4"

[dev-dependencies]
ws = {version = "0.9", path = "../ws", package = "pi_ws" }
env_logger = "0.11"
udp = {version = "0.7", path = "../blocking_udp", package = "pi_blocking_udp" }
quinn-proto = "0.8"
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.20"
futures-util = "0.3"
url = "2.0"
rand = "0.8"
mqttbytes = "0.2"
libc = "0.2"
