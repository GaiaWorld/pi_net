[package]
name = "pi_http"
version = "0.6.3"
authors = ["vmos <vmos@fairblock.io>"]
edition = "2021"
description = "pi_http"
repository = "https://github.com/GaiaWorld/pi_net/tree/crateio"
license = "MIT OR Apache-2.0"
keywords = ["pi", "http"]

[dependencies]
mio = "0.8"
url = "2.5"
mime = "0.3"
mime_guess = "2.0"
twoway = "0.2"
https = { package = "http", version = "0.2" }
httparse = "1.8"
httpdate = "1.0"
serde_json = { version = "1.0", features = ["preserve_order"] }
futures = "0.3"
parking_lot = "0.12"
crossbeam-channel = "0.5"
regex = "1.6"
base64 = "0.13"
flate2 = "1.1"
brotli = "3.3"
bytes = "~1.11"
pi_atom = "0.6"
path-absolutize = "3.1"
flume = "0.11"
log = "0.4"
dashmap = "6.1"
wyhash = "0.6"
pi-async-rt = "0.3"
pi_async_file = "0.8"
pi_handler = "0.2"
pi_hash = { version = "0.1", features = ["xxhash"] }
pi_gray = "0.1"
pi_adler32 = "0.1"
tcp = { version = "0.7", package="pi_tcp", path = "../tcp" }

[dev-dependencies]
route-recognizer = "0.3"
env_logger = "0.11"
